name: Python tests

on:
  push:
    branches: [main]
    paths: &inputs
      - "apps/api/**"
      - "libs/collectors/**"
      - "tests/**"
      - "supabase/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths: *inputs

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mindbase
          POSTGRES_PASSWORD: mindbase_dev
          POSTGRES_DB: mindbase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies (uv workspace)
        run: uv sync --all-packages

      - name: Lint Python
        run: |
          uv run black --check apps/api/ libs/collectors/
          uv run ruff check apps/api/ libs/collectors/ tests/

      - name: Run Python tests
        env:
          DATABASE_URL: postgresql+asyncpg://mindbase:mindbase_dev@localhost:5432/mindbase_test
          OLLAMA_URL: http://localhost:11434
          EMBEDDING_MODEL: qwen3-embedding:8b
          EMBEDDING_DIMENSIONS: 4096
          SUMMARY_MODEL: qwen3:14b
        run: uv run pytest tests/ -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
